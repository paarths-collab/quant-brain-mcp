name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant_test -d quant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://quant_test:test_only_password@localhost:5432/quant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements_research.txt pytest==9.1.1
      - run: python -m pip check
      - run: python -m pytest -q
      - run: kaleido_get_chrome
      - run: python smoke_test.py
